<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ЕГЭ линкеры • Oxford Word Skills</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: linear-gradient(145deg, #f5f9ff 0%, #e2eafc 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .game-container {
      max-width: 1000px;
      width: 100%;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(8px);
      border-radius: 2.5rem;
      box-shadow: 0 25px 40px -12px rgba(0, 20, 60, 0.35), 0 0 0 1px rgba(255,255,255,0.6);
      padding: 2.2rem 2.5rem;
      transition: all 0.2s;
    }
    h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #0b2b4e;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      border-bottom: 3px solid #b6cdf0;
      padding-bottom: 0.7rem;
      margin-bottom: 1.8rem;
    }
    h1 span {
      background: #1e4b7a;
      color: white;
      font-size: 1.1rem;
      font-weight: 500;
      padding: 0.2rem 1rem;
      border-radius: 40px;
      margin-left: auto;
      letter-spacing: 0.3px;
    }
    .stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      background: #d9e6fa;
      border-radius: 3rem;
      padding: 0.5rem 1.5rem;
      font-weight: 600;
      color: #14375c;
    }
    .score, .progress {
      display: flex;
      align-items: center;
      gap: 0.7rem;
    }
    .badge {
      background: #1e4b7a;
      color: white;
      border-radius: 3rem;
      padding: 0.3rem 1rem;
      font-size: 1.2rem;
    }
    .question-area {
      margin-bottom: 2rem;
    }
    .question-text {
      font-size: 1.5rem;
      line-height: 1.4;
      font-weight: 500;
      color: #0b2b4e;
      background: #ffffffde;
      padding: 1.2rem 1.8rem;
      border-radius: 1.8rem;
      margin-bottom: 1.8rem;
      border-left: 12px solid #4b7bb5;
      box-shadow: 0 6px 14px rgba(0, 20, 50, 0.08);
      word-break: break-word;
    }
    .sentence {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.3rem 0.6rem;
    }
    .blank {
      background: #f0f4fe;
      border: 2px dashed #2e5f8e;
      border-radius: 0.7rem;
      padding: 0.2rem 0.8rem;
      font-weight: 700;
      color: #1e4b7a;
      min-width: 100px;
      text-align: center;
      font-size: 1.4rem;
      box-shadow: inset 0 1px 4px rgba(0,0,0,0.02);
    }
    .options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 2.2rem;
    }
    .option-btn {
      background: white;
      border: 2px solid #c7d9f0;
      border-radius: 1.5rem;
      padding: 1rem 1.2rem;
      font-size: 1.2rem;
      font-weight: 600;
      color: #113355;
      cursor: pointer;
      transition: all 0.12s ease;
      box-shadow: 0 6px 0 #b0c6e0;
      text-align: left;
      letter-spacing: 0.2px;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .option-btn:hover:not(:disabled) {
      background: #e8f0fe;
      border-color: #4b7bb5;
      transform: translateY(-2px);
      box-shadow: 0 8px 0 #9bb1cf;
    }
    .option-btn:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 4px 0 #9bb1cf;
    }
    .option-btn.correct {
      background: #c8e6d9;
      border-color: #1e7a4a;
      box-shadow: 0 6px 0 #0e5a34;
      color: #0a3b22;
    }
    .option-btn.wrong {
      background: #f8d7da;
      border-color: #b02a37;
      box-shadow: 0 6px 0 #871e28;
      color: #5a151d;
      text-decoration: line-through 2px rgba(150, 0, 0, 0.4);
    }
    .option-btn:disabled {
      cursor: default;
      opacity: 0.9;
      transform: translateY(0);
      box-shadow: 0 4px 0 #a0b5cc;
    }
    .option-btn.correct:disabled, .option-btn.wrong:disabled {
      opacity: 1;
    }
    .feedback {
      min-height: 3.5rem;
      font-size: 1.2rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      padding: 0.6rem 1.4rem;
      border-radius: 1.5rem;
      background: #eef3fc;
      color: #1e3b5a;
      transition: 0.1s;
      margin-top: 0.5rem;
    }
    .feedback.correct-fb {
      background: #d4edda;
      color: #0c5426;
      border-left: 10px solid #2e7d5e;
    }
    .feedback.wrong-fb {
      background: #f8dddf;
      color: #821c27;
      border-left: 10px solid #b02a37;
    }
    .next-btn {
      background: #1e4b7a;
      color: white;
      border: none;
      border-radius: 3rem;
      font-size: 1.3rem;
      font-weight: 600;
      padding: 1rem 2.8rem;
      cursor: pointer;
      transition: 0.1s;
      box-shadow: 0 8px 0 #0e2b48;
      letter-spacing: 0.5px;
      margin-top: 1rem;
      width: fit-content;
      float: right;
    }
    .next-btn:hover:not(:disabled) {
      background: #2a5f92;
      transform: translateY(-2px);
      box-shadow: 0 10px 0 #0e2b48;
    }
    .next-btn:active:not(:disabled) {
      transform: translateY(4px);
      box-shadow: 0 4px 0 #0e2b48;
    }
    .next-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: translateY(4px);
      box-shadow: 0 4px 0 #0e2b48;
    }
    .reset-btn {
      background: transparent;
      border: 2px solid #1e4b7a;
      border-radius: 3rem;
      padding: 0.7rem 1.8rem;
      font-weight: 600;
      color: #1e4b7a;
      cursor: pointer;
      font-size: 1rem;
      transition: 0.1s;
      margin-right: 1rem;
    }
    .reset-btn:hover {
      background: #e2eafc;
    }
    .footer-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 1.5rem;
    }
    .clearfix::after {
      content: "";
      clear: both;
      display: table;
    }
    .highlight {
      background: #f9eec1;
      border-radius: 8px;
      padding: 0.1rem 0.3rem;
      font-weight: 700;
      color: #7a5c00;
    }
  </style>
</head>
<body>
<div class="game-container">
  <h1>
    🔗 Линкеры • ЕГЭ
    <span>Oxford Word Skills</span>
  </h1>

  <div class="stats">
    <div class="score">🎯 Счёт: <span id="scoreDisplay" class="badge">0</span></div>
    <div class="progress">📌 Вопрос: <span id="progressDisplay" class="badge">1 / 14</span></div>
  </div>

  <div class="question-area">
    <div class="question-text" id="questionText">
      <!-- dynamic content -->
    </div>

    <div class="options" id="optionsContainer">
      <!-- buttons here -->
    </div>

    <div class="feedback" id="feedbackMessage">
      Выбери подходящий линкер...
    </div>
  </div>

  <div class="footer-actions clearfix">
    <button class="reset-btn" id="resetGameBtn">⟲ Заново</button>
    <button class="next-btn" id="nextQuestionBtn" disabled>Далее →</button>
  </div>
</div>

<script>
  // ==========  БАНК ВОПРОСОВ (14 штук) ==========
  const questions = [
    // 1
    { text: 'It snowed heavily, and ______ we had to stay in for two days.',
      correct: 'as a result',
      options: ['as a result', 'plus', 'because', 'due to'] },
    // 2
    { text: 'It was an old armchair, and ______, it smelled horrible.',
      correct: "what's more",
      options: ["what's more", 'because', 'as', 'since'] },
    // 3
    { text: 'He had to give up his job ______ stress.',
      correct: 'due to',
      options: ['due to', 'consequently', 'therefore', 'since'] },
    // 4
    { text: 'People are richer these days and ______ they spend a lot more.',
      correct: 'therefore',
      options: ['therefore', 'since', 'as', 'because'] },
    // 5
    { text: 'It was a long way to the station, ______ I had a suitcase.',
      correct: 'plus',
      options: ['plus', 'so', 'as a result', 'consequently'] },
    // 6
    { text: '______ he had no money, I ended up paying the bill.',
      correct: 'Since',
      options: ['Since', 'Furthermore', 'Moreover', 'In addition'] },
    // 7
    { text: 'Zoltan saw a man standing in the shadows. ______, he was holding a knife.',
      correct: 'Moreover',
      options: ['Moreover', 'Therefore', 'As a result', 'Consequently'] },
    // 8
    { text: 'The town has a good transport system. ______, it is very cheap.',
      correct: 'Furthermore',
      options: ['Furthermore', 'As a result', 'So', 'Consequently'] },
    // 9 (из spotlight / формальные)
    { text: 'The business was in trouble. ______, his activities had attracted the attention of the police.',
      correct: 'In addition',
      options: ['In addition', 'As a result', 'Since', 'Due to'] },
    // 10 – based on exercise 4
    { text: 'He got the job ______ his lack of experience.',
      correct: 'in spite of',
      options: ['in spite of', 'despite the fact that', 'even though', 'although'] },
    // 11
    { text: 'He felt really cold ______ the fact that the heating was on.',
      correct: 'despite',
      options: ['despite', 'although', 'even though', 'though'] },
    // 12 – mixed linkers (however/nevertheless)
    { text: 'He went to bed very late. ______, he got to work on time in the morning.',
      correct: 'All the same',
      options: ['All the same', 'Nevertheless', 'However', 'Although'] },  // все варианты приемлемы, но "All the same" точно из упражнения
    // 13 – condition / purpose
    { text: 'I took some money ______ I could pay.',
      correct: 'so that',
      options: ['so that', 'in case', 'unless', 'otherwise'] },
    // 14 – unless / otherwise
    { text: 'She won\'t use a towel ______ it\'s just been washed.',
      correct: 'unless',
      options: ['unless', 'otherwise', 'so that', 'in case'] }
  ];

  // ==========  СОСТОЯНИЕ ==========
  let currentIndex = 0;
  let score = 0;
  let answered = false;       // блокировка на текущем вопросе
  let correctAnswersCount = 0;

  // DOM элементы
  const questionTextEl = document.getElementById('questionText');
  const optionsContainer = document.getElementById('optionsContainer');
  const feedbackEl = document.getElementById('feedbackMessage');
  const nextBtn = document.getElementById('nextQuestionBtn');
  const resetBtn = document.getElementById('resetGameBtn');
  const scoreDisplay = document.getElementById('scoreDisplay');
  const progressDisplay = document.getElementById('progressDisplay');

  // ==========  ОТРИСОВКА ВОПРОСА ==========
  function renderQuestion() {
    const q = questions[currentIndex];
    // Форматируем предложение: заменяем ______ на стилизованный пропуск
    let sentenceHtml = q.text.replace(/______/g, '<span class="blank">______</span>');
    questionTextEl.innerHTML = `<div class="sentence">${sentenceHtml}</div>`;

    // Генерируем кнопки-опции
    optionsContainer.innerHTML = '';
    // Перемешаем опции? Нет, оставим как в массиве, но можно перемешать для интереса
    // (но для предсказуемости оставим порядок как в вопросе)
    q.options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.textContent = opt;
      btn.dataset.value = opt;
      btn.addEventListener('click', () => handleOptionClick(btn, opt));
      optionsContainer.appendChild(btn);
    });

    // Сброс UI
    feedbackEl.textContent = 'Выбери подходящий линкер...';
    feedbackEl.className = 'feedback';
    answered = false;
    nextBtn.disabled = true;

    // Обновляем прогресс
    progressDisplay.textContent = `${currentIndex + 1} / ${questions.length}`;
    updateScoreDisplay();
  }

  // ==========  ОБРАБОТКА КЛИКА ==========
  function handleOptionClick(btn, selectedValue) {
    if (answered) return; // уже ответили

    const q = questions[currentIndex];
    const isCorrect = (selectedValue === q.correct);

    // Блокируем все кнопки
    const allButtons = document.querySelectorAll('.option-btn');
    allButtons.forEach(b => b.disabled = true);

    // Подсветка
    allButtons.forEach(b => {
      if (b.dataset.value === q.correct) {
        b.classList.add('correct');
      }
    });

    if (isCorrect) {
      btn.classList.add('correct');
      feedbackEl.textContent = `✅ Верно! «${q.correct}» — правильный линкер.`;
      feedbackEl.className = 'feedback correct-fb';
      score += 10;
      correctAnswersCount++;
    } else {
      btn.classList.add('wrong');
      feedbackEl.textContent = `❌ Неверно. Правильный ответ: «${q.correct}».`;
      feedbackEl.className = 'feedback wrong-fb';
      // Можно добавить 0 очков или частично, но оставим без очков
    }

    answered = true;
    nextBtn.disabled = false;
    updateScoreDisplay();
  }

  // ==========  ОБНОВЛЕНИЕ СЧЁТА ==========
  function updateScoreDisplay() {
    scoreDisplay.textContent = score;
  }

  // ==========  СЛЕДУЮЩИЙ ВОПРОС ==========
  function nextQuestion() {
    if (currentIndex < questions.length - 1) {
      currentIndex++;
      renderQuestion();
    } else {
      // Игра завершена
      questionTextEl.innerHTML = `<div class="sentence" style="font-size:1.7rem; font-weight:600; color:#0b2b4e;">🏁 Игра завершена!</div>`;
      optionsContainer.innerHTML = '';
      feedbackEl.textContent = `Твой результат: ${score} из ${questions.length * 10} возможных. Правильных ответов: ${correctAnswersCount} из ${questions.length}.`;
      feedbackEl.className = 'feedback correct-fb';
      nextBtn.disabled = true;
      progressDisplay.textContent = `${questions.length} / ${questions.length}`;
      // Можно спрятать кнопку далее или переименовать
      nextBtn.textContent = 'Конец';
      // Разрешим сброс
    }
  }

  // ==========  СБРОС ИГРЫ ==========
  function resetGame() {
    currentIndex = 0;
    score = 0;
    correctAnswersCount = 0;
    answered = false;
    nextBtn.textContent = 'Далее →';
    nextBtn.disabled = true;
    updateScoreDisplay();
    renderQuestion();
  }

  // ==========  ИНИЦИАЛИЗАЦИЯ ==========
  function initGame() {
    resetGame();
    // Обработчики
    nextBtn.addEventListener('click', () => {
      if (currentIndex < questions.length - 1) {
        nextQuestion();
      } else {
        // Если игра завершена, кнопка "Конец" — ничего не делает, либо можно перезапустить
        // Но на всякий случай
      }
    });
    resetBtn.addEventListener('click', resetGame);
  }

  // Запуск
  initGame();

  // Небольшой штрих: если игра завершена, nextBtn называется "Конец", но также можно перезапустить
  // Добавим логику: после завершения при клике на "Конец" — сброс? Нет, оставим как есть, но сброс всегда доступен.
  // Также при завершении скроем прогресс? нет, оставим.
</script>
</body>
</html>
